# =================================================================
# 京东云亚瑟 AX1800 Pro 512MB 内存超低占用专属调优参数
# =================================================================

# 1. 缓存激进回收：促使内核快速释放不活跃的 dentry 与 inode 缓存，保持空闲内存充沛
vm.vfs_cache_pressure = 150

# 2. 内存交换积极性：配合 zram-swap 高速压缩内存，平衡物理内存与交换空间
vm.swappiness = 30

# 3. 脏页写入阈值：提早将内存脏页刷入 eMMC 存储，防止突发流量占用过多写缓冲
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# 4. 最小可用内存水位：保留 8MB 物理内存底线，杜绝高负载网络吞吐时网卡驱动报内存不足
vm.min_free_kbytes = 8192

# 5. 连接跟踪与协议栈优化：既能稳定承受海量并发连接，又严格限制 slab 内存占用
net.netfilter.nf_conntrack_max = 65536
net.netfilter.nf_conntrack_tcp_timeout_established = 7440
net.core.netdev_max_backlog = 2048
